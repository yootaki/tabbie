; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html

; ---- オリジナル: 汎用 ESP32 + 1.3" I2C モノクロOLED(SH1106) ----------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.9
    bblanchon/ArduinoJson@^7.0.4
    madhephaestus/ESP32Servo@^1.2.0

; ---- 移植: M5StickC PLUS2 -------------------------------------------------
; PLUS2 はカラーTFT(ST7789/SPI)。src/u8g2_compat_m5.h が U8g2 API を M5GFX に
; 橋渡しするので main.cpp の display 呼び出しはそのまま使える。
; PlatformIO に PLUS2 のボード定義は無いため m5stick-c を 8MB 向けに上書きする。
[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
upload_speed = 1500000
board_upload.flash_size = 8MB
board_build.flash_size = 8MB
board_upload.maximum_size = 8388608
; 顔アニメが 97フレーム×5種でフラッシュを食う。既定(1.3MB)では入らないので
; OTA を捨ててアプリ領域を 3MB に広げる
board_build.partitions = huge_app.csv
build_flags =
    -DTABBIE_M5STICKC_PLUS2
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    m5stack/M5Unified@^0.2.0
    bblanchon/ArduinoJson@^7.0.4
    madhephaestus/ESP32Servo@^1.2.0
